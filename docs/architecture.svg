<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" role="img"
     aria-label="An agent asks the Agent Visa server for context; every call passes through policy; the holder approves at the console; a transit visa reaches a sub-agent; revoke cuts both.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5C6673"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F15A3A"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#234C92"/>
    </marker>
    <style>
      .box  { fill: none; stroke: #5C6673; stroke-width: 1.5; rx: 10; }
      .key  { fill: none; stroke: #234C92; stroke-width: 2.5; rx: 10; }
      .t    { font: 600 14px sans-serif; fill: #6E7681; }
      .s    { font: 12px sans-serif; fill: #8A9199; }
      .m    { font: 11px ui-monospace, monospace; fill: #234C92; }
      .mc   { font: 11px ui-monospace, monospace; fill: #F15A3A; }
      .line { stroke: #5C6673; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .blue { stroke: #234C92; stroke-width: 2; fill: none; marker-end: url(#ab); }
      .cut  { stroke: #F15A3A; stroke-width: 2; fill: none; marker-end: url(#ac); stroke-dasharray: 6 4; }
      .cap  { font: 600 11px sans-serif; fill: #F15A3A; letter-spacing: .08em; }
    </style>
  </defs>

  <!-- agent -->
  <rect class="box" x="20" y="60" width="150" height="66"/>
  <text class="t" x="95" y="88" text-anchor="middle">Agent</text>
  <text class="s" x="95" y="107" text-anchor="middle">any MCP client</text>

  <!-- server -->
  <rect class="box" x="270" y="30" width="230" height="126"/>
  <text class="t" x="385" y="55" text-anchor="middle">Agent Visa MCP server</text>
  <text class="m" x="385" y="76" text-anchor="middle">request_pass · check_pass</text>
  <text class="m" x="385" y="92" text-anchor="middle">read_context · issue_visa</text>
  <text class="m" x="385" y="108" text-anchor="middle">suggest_write</text>
  <text class="s" x="385" y="132" text-anchor="middle">adapters only: no rules live here</text>

  <!-- policy -->
  <rect class="key" x="285" y="196" width="200" height="70"/>
  <text class="t" x="385" y="221" text-anchor="middle" fill="#234C92">policy.py</text>
  <text class="s" x="385" y="240" text-anchor="middle">pure, no I/O, explicit clock</text>
  <text class="s" x="385" y="256" text-anchor="middle">every call passes through</text>

  <!-- store -->
  <rect class="box" x="285" y="316" width="200" height="76"/>
  <text class="t" x="385" y="341" text-anchor="middle">store.py · SQLite</text>
  <text class="s" x="385" y="359" text-anchor="middle">passport, grants, receipts</text>
  <text class="s" x="385" y="376" text-anchor="middle">receipt written in the same txn</text>

  <!-- console -->
  <rect class="box" x="620" y="196" width="240" height="86"/>
  <text class="t" x="740" y="221" text-anchor="middle">Holder console</text>
  <text class="s" x="740" y="240" text-anchor="middle">approve · deny · revoke</text>
  <text class="s" x="740" y="258" text-anchor="middle">live receipts ledger</text>
  <text class="s" x="740" y="275" text-anchor="middle">the person decides here</text>

  <!-- ego.ist -->
  <rect class="box" x="620" y="52" width="240" height="70"/>
  <text class="t" x="740" y="77" text-anchor="middle">ego.ist public MCP</text>
  <text class="m" x="740" y="97" text-anchor="middle">read_public_profile</text>
  <text class="s" x="740" y="113" text-anchor="middle">live call, real published passport</text>

  <!-- sub-agent -->
  <rect class="box" x="20" y="316" width="150" height="76"/>
  <text class="t" x="95" y="341" text-anchor="middle">Sub-agent</text>
  <text class="s" x="95" y="359" text-anchor="middle">transit visa</text>
  <text class="s" x="95" y="376" text-anchor="middle">subset · 10 min · 1 hop</text>

  <!-- flows -->
  <path class="line" d="M170 84 L264 84"/>
  <text class="s" x="217" y="76" text-anchor="middle">asks</text>
  <path class="line" d="M264 106 L176 106" marker-end="url(#a)"/>
  <text class="s" x="217" y="122" text-anchor="middle">scoped context</text>

  <path class="blue" d="M385 156 L385 190"/>
  <text class="m" x="396" y="178">decide</text>
  <path class="line" d="M385 266 L385 310"/>
  <text class="s" x="396" y="292">record</text>

  <path class="line" d="M500 78 L614 78"/>
  <text class="s" x="557" y="70" text-anchor="middle">live read</text>
  <path class="line" d="M700 282 C700 330, 560 340, 491 348" marker-start="url(#a)"/>
  <text class="s" x="620" y="322" text-anchor="middle">reads the inbox,</text>
  <text class="s" x="620" y="338" text-anchor="middle">writes the decision</text>

  <path class="blue" d="M285 354 L176 354"/>
  <text class="m" x="230" y="346" text-anchor="middle">issue_visa</text>

  <!-- revoke path -->
  <path class="cut" d="M740 282 L740 420 L120 420 L110 398"/>
  <text class="cap" x="430" y="440" text-anchor="middle">REVOKE CASCADES: THE PASS AND EVERY VISA CUT FROM IT, MID-TASK</text>
  <line x1="95" y1="300" x2="95" y2="130" stroke="#F15A3A" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="78" y1="209" x2="112" y2="225" stroke="#F15A3A" stroke-width="2.5"/>
  <line x1="112" y1="209" x2="78" y2="225" stroke="#F15A3A" stroke-width="2.5"/>
</svg>
