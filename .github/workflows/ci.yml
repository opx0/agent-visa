name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: typecheck
        run: uv run mypy src
      - name: test
        run: uv run pytest
