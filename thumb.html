<!doctype html><html><head><meta charset="utf-8"><style>
* { margin:0; box-sizing:border-box; }
body { width:1200px; height:800px; display:flex; align-items:center; justify-content:center;
       background:repeating-linear-gradient(0deg,#f4f2ec,#f4f2ec 28px,#efede6 29px);
       font-family:ui-sans-serif,system-ui,'Helvetica Neue',sans-serif; overflow:hidden; }
#card { position:relative; width:760px; height:480px; border-radius:28px; padding:44px 48px;
        background:linear-gradient(135deg,#234C92,#16305e 70%); color:#fff;
        box-shadow:0 30px 80px rgba(20,30,60,.3); transform:rotate(-2deg); }
.kicker { font-size:15px; letter-spacing:.34em; text-transform:uppercase; opacity:.75; }
h1 { font-size:64px; font-weight:800; letter-spacing:-.01em; margin-top:14px; line-height:1.05; }
h1 em { font-style:normal; color:#F2E600; }
.sub { font-family:ui-monospace,monospace; font-size:19px; margin-top:22px; opacity:.9; }
.chip { position:absolute; top:44px; right:48px; width:64px; height:46px; border-radius:10px;
        background:linear-gradient(135deg,#F2E600,#F15A3A); }
.visa { position:absolute; left:44px; bottom:40px; border:3px solid #F2E600; color:#F2E600;
        border-radius:12px; padding:10px 18px; font-family:ui-monospace,monospace; font-size:20px;
        letter-spacing:.08em; transform:rotate(-4deg); background:rgba(0,0,0,.18); }
.revoked { position:absolute; right:30px; bottom:70px; border:6px solid #F15A3A; color:#F15A3A;
           border-radius:14px; padding:12px 26px; font-size:44px; font-weight:900;
           letter-spacing:.16em; transform:rotate(12deg); opacity:.92; background:rgba(255,255,255,.06); }
</style></head><body>
<div id="card"><div class="chip"></div>
  <div class="kicker">The Ideathon · Agents · Build</div>
  <h1>Your passport stays home.<br>Your agent travels <em>on a visa.</em></h1>
  <div class="sub">read: [taste.summary, commerce.budget] · session</div>
  <div class="visa">AGENT VISA · taste ∩ budget · TTL 10:00</div>
  <div class="revoked">REVOKED</div>
</div>
</body></html>
